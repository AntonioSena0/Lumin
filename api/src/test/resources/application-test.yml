spring:

  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/lumin_test}
    username: ${TEST_DB_USERNAME:lumin_test}
    password: ${TEST_DB_PASSWORD:lumin_test}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${TEST_JWT_SECRET:0123456789ABCDEF0123456789ABCDEF}
  exp-min: 15

cookie:
  secure: false
