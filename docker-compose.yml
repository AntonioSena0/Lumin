services:
  db:
    image: postgres:17
    container_name: lumin_db
    env_file:
      - ./api/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: lumin_messaging
    environment:
      RABBITMQ_DEFAULT_USER: lumin
      RABBITMQ_DEFAULT_PASS: lumin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lumin_app
    env_file:
      - ./api/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mailservice:
    build:
      context: ./mailservice
    container_name: lumin_mail
    env_file: [./mailservice/.env]
    depends_on:
      rabbitmq:
        condition: service_healthy

  db-test:
    profiles: ["test"]
    image: postgres:17
    container_name: lumin_db_test
    environment:
      POSTGRES_DB: lumin_test
      POSTGRES_USER: lumin_test
      POSTGRES_PASSWORD: lumin_test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lumin_test -d lumin_test" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-test:
    profiles: [ "test" ]
    image: maven:3.9.9-eclipse-temurin-21-alpine
    container_name: lumin_test_runner
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      TEST_DB_URL: jdbc:postgresql://db-test:5432/lumin_test
      TEST_DB_USERNAME: lumin_test
      TEST_DB_PASSWORD: lumin_test
      TEST_JWT_SECRET: "0123456789ABCDEF0123456789ABCDEF"
      SPRING_PROFILES_ACTIVE: test
    command: ["mvn",
              "-B",
              "-Dtest=AuthRefreshRotationTest,PlacementSubmitTest,SettingPatchTest,MeSecurityTest,UserLanguageProgressConcurrencyTest",
              "-DfailIfNoTests=false",
              "test"]
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres_data:
